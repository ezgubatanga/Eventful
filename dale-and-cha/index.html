<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dale & Cha - Save the Date</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            width: 100vw; 
            height: 100vh; 
            background: #eae6df; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Envelope Styles */
        .envelope-container {
            width: 340px; 
            height: 340px; 
            position: absolute; 
            perspective: 1000px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .envelope-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #e6e1d6; 
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .envelope-bottom {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f1ede3;
            clip-path: polygon(0 100%, 50% 45%, 100% 100%);
            z-index: 3;
            filter: drop-shadow(0 -3px 5px rgba(0,0,0,0.05));
        }
        
        .envelope-left {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f7f4eb;
            clip-path: polygon(0 0, 50% 45%, 0 100%);
            z-index: 2;
        }
        
        .envelope-right {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f7f4eb;
            clip-path: polygon(100% 0, 50% 45%, 100% 100%);
            z-index: 2;
        }

        .envelope-flap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 55%;
            background: #fffdf7;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: bottom center; /* STRICT REQUIREMENT */
            z-index: 4;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.01) 0px, rgba(0,0,0,0.01) 2px, transparent 2px, transparent 4px);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.08));
        }

        .envelope-label {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #8a8171;
            z-index: 5;
            background: rgba(255,255,255,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* STD Card */
        .STD-card {
            position: absolute;
            width: 320px;
            height: 520px;
            background: #fffcf9;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            z-index: 5;
        }
        .STD-card.active {
            pointer-events: auto;
        }

        .scratch-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: relative;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        .scratch-underneath {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #dfc699, #a38c64);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scratch-underneath svg {
            width: 60%;
            height: 60%;
            fill: #fff;
            opacity: 0.85;
        }

        .scratch-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer;
            z-index: 2;
            touch-action: none;
        }

        .content-group {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .text-hidden {
            opacity: 0;
            transform: translateY(20px);
        }

        .subtitle {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: #a38c64;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Playfair Display', 'Didot', Georgia, serif;
            font-size: 38px;
            color: #2c2a28;
            margin-bottom: 15px;
            font-style: italic;
        }

        .date {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: #4a4641;
            margin-bottom: 35px;
        }

        .countdown {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
        }

        .time-value {
            font-family: 'Playfair Display', 'Didot', Georgia, serif;
            font-size: 26px;
            color: #2c2a28;
            line-height: 1.1;
        }

        .time-label {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 9px;
            letter-spacing: 1px;
            color: #8c8270;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .cta-btn {
            background: #2c2a28;
            color: #fff;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: #4a4641;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Phase 1: Envelope -->
    <div class="envelope-container">
        <div class="envelope-back"></div>
        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-bottom"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-label">Tap To Open</div>
    </div>

    <!-- Phase 2 & 3: Card & Scratch-Off -->
    <div class="STD-card">
        <div class="scratch-container">
            <div class="scratch-underneath">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Elegant minimalist couple silhouette -->
                    <path d="M40,90 C40,65 45,50 50,50 C55,50 60,65 60,90 Z" fill="#fff" opacity="0.9"/>
                    <circle cx="46" cy="38" r="9" fill="#fff" opacity="0.9"/>
                    <circle cx="56" cy="42" r="8" fill="#fff" opacity="0.9"/>
                </svg>
            </div>
            <canvas id="scratch-pad" class="scratch-canvas"></canvas>
        </div>

        <div class="content-group">
            <div class="subtitle text-hidden">We Are Getting Married</div>
            <div class="title text-hidden">Dale & Cha</div>
            <div class="date text-hidden">JUNE 15, 2027</div>
            
            <div class="countdown text-hidden">
                <div class="time-box"><span class="time-value" id="cd-days">00</span><span class="time-label">Days</span></div>
                <div class="time-box"><span class="time-value" id="cd-hours">00</span><span class="time-label">Hrs</span></div>
                <div class="time-box"><span class="time-value" id="cd-minutes">00</span><span class="time-label">Min</span></div>
                <div class="time-box"><span class="time-value" id="cd-seconds">00</span><span class="time-label">Sec</span></div>
            </div>

            <button class="cta-btn text-hidden">Tap To RSVP</button>
        </div>
    </div>
</div>

<script>
    // --- PHASE 1: ENVELOPE OPENING ---
    const envContainer = document.querySelector('.envelope-container');
    const flap = document.querySelector('.envelope-flap');
    const card = document.querySelector('.STD-card');

    // Initial state setup just in case
    gsap.set(flap, { rotationX: 0 });

    envContainer.addEventListener('click', () => {
        envContainer.style.pointerEvents = 'none'; // Prevent double clicks
        
        const tl = gsap.timeline();
        // 1. Animate the top flap: rotationX rotates upward from 0deg to -160deg
        tl.to(flap, { 
            rotationX: -160, 
            ease: "power2.inOut", 
            duration: 1.2 
        })
        // 2. Immediately following, scale down and fade out envelope
        .to(envContainer, { 
            scale: 0.9, 
            opacity: 0, 
            duration: 0.5, 
            display: "none" 
        })
        // 3. Reveal the main invitation card
        .to(card, { 
            opacity: 1, 
            scale: 1, 
            duration: 0.8, 
            ease: "power2.out",
            onComplete: () => {
                card.classList.add('active');
            }
        }, "-=0.2");
    });


    // --- PHASE 2: CANVAS SCRATCH-OFF ---
    const canvas = document.getElementById('scratch-pad');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false;
    let scratchThresholdMet = false;

    // High res canvas for retina displays
    const size = 200;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.scale(dpr, dpr);

    // Create textured gray/matte-gold fill
    // We'll use an HTML5 canvas pattern to simulate texture
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 20;
    pCanvas.height = 20;
    const pCtx = pCanvas.getContext('2d');
    pCtx.fillStyle = '#b5a183'; // Matte gold
    pCtx.fillRect(0, 0, 20, 20);
    // Add subtle noise
    for(let i=0; i<40; i++){
        pCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.05)';
        pCtx.fillRect(Math.random()*20, Math.random()*20, 1, 1);
    }
    const pattern = ctx.createPattern(pCanvas, 'repeat');
    ctx.fillStyle = pattern;
    ctx.fillRect(0, 0, size, size);

    // Setup scratch settings
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 40; // 20px radius => 40px diameter
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
        return {
            x: (clientX - rect.left) * (size / rect.width),
            y: (clientY - rect.top) * (size / rect.height)
        };
    }

    function startDraw(e) {
        if(scratchThresholdMet) return;
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function draw(e) {
        if(!isDrawing || scratchThresholdMet) return;
        e.preventDefault(); 
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        
        // Randomly check threshold to avoid checking every frame
        if (Math.random() > 0.7) {
            checkThreshold();
        }
    }

    function stopDraw() {
        if(!isDrawing) return;
        isDrawing = false;
        checkThreshold();
    }

    // Pointer events
    canvas.addEventListener('pointerdown', startDraw);
    window.addEventListener('pointermove', draw, {passive: false});
    window.addEventListener('pointerup', stopDraw);
    // Touch events fallback
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    window.addEventListener('touchmove', draw, {passive: false});
    window.addEventListener('touchend', stopDraw);

    function checkThreshold() {
        if(scratchThresholdMet) return;
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        let cleared = 0;
        
        // Check alpha channel of every 16th pixel for performance
        for(let i = 3; i < pixels.length; i += 16) {
            if(pixels[i] === 0) cleared++;
        }
        
        const totalChecks = pixels.length / 16;
        const clearedPercentage = cleared / totalChecks;
        
        if(clearedPercentage >= 0.5) {
            scratchThresholdMet = true;
            // Fade out canvas
            gsap.to(canvas, { opacity: 0, duration: 0.8, onComplete: () => {
                canvas.style.display = 'none';
            }});
            
            // Trigger Phase 3
            triggerPhase3();
        }
    }


    // --- PHASE 3: COUNTDOWN & CONTENT STAGGER ---
    function triggerPhase3() {
        const tl = gsap.timeline();
        tl.to('.text-hidden', {
            opacity: 1,
            y: 0,
            duration: 0.8,
            stagger: 0.15,
            ease: "power2.out"
        });
        
        initCountdown();
    }

    function initCountdown() {
        const targetDate = new Date("June 15, 2027 00:00:00").getTime();
        
        const dEl = document.getElementById('cd-days');
        const hEl = document.getElementById('cd-hours');
        const mEl = document.getElementById('cd-minutes');
        const sEl = document.getElementById('cd-seconds');

        function update() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            
            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            dEl.innerText = days.toString().padStart(2, '0');
            hEl.innerText = hours.toString().padStart(2, '0');
            mEl.innerText = minutes.toString().padStart(2, '0');
            sEl.innerText = seconds.toString().padStart(2, '0');
        }

        update(); // Initial call
        setInterval(update, 1000);
    }
</script>
</body>
</html>
